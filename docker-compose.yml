# Full stack. Written carefully but NOT run in the authoring environment (no Docker there):
# treat the first `docker compose up --build` as a test of this file.
x-app: &app
  build: .
  environment: &env
    DATABASE_URL: postgresql+psycopg://backlot:backlot@postgres:5432/backlot
    KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
    REDIS_URL: redis://redis:6379/0
    VISION_ADAPTER: ${VISION_ADAPTER:-simulated}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5-5}
    VISION_MODEL: ${VISION_MODEL:-claude-sonnet-5-5}

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    command: >
      redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M --node-id 0 --check=false
      --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: backlot, POSTGRES_PASSWORD: backlot, POSTGRES_DB: backlot}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backlot"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7
    ports: ["6379:6379"]

  init-topics:
    <<: *app
    command: python -m scripts.create_topics
    depends_on: {redpanda: {condition: service_healthy}}
    restart: "no"
  gateway:
    <<: *app
    command: uvicorn services.event_gateway.app:create_default_app --factory --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on: {init-topics: {condition: service_completed_successfully}}
  evidence-worker:
    <<: *app
    command: python -m services.evidence_worker.main
    restart: on-failure
    depends_on:
      init-topics: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
  api:
    <<: *app
    command: >
      sh -c "test -f models/risk_model.joblib || python -m scripts.train_model;
             test -f data/samples/image_annotations.json || python -m scripts.generate_data;
             uvicorn services.api.app:create_default_app --factory --host 0.0.0.0 --port 8001"
    ports: ["8001:8001"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_started}}
  ui:
    <<: *app
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    environment: {<<: *env, BACKLOT_API_URL: "http://api:8001"}
    ports: ["8501:8501"]
    depends_on: [api]
